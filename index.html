<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // 最早启动计时锚点：记录文档解析开始时间（performance 相对值 + 墙上时间），供 main.tsx 上报 splash/React 挂载耗时
      window.__startup = { t0: performance.now(), wall0: Date.now(), domReady: 0 };
      document.addEventListener("DOMContentLoaded", () => { window.__startup.domReady = Date.now(); }, { once: true });
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

</html>
