<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- LlamaDock 主视觉：几何羊驼头 + dock 底座。配色取自 src/index.css 主题令牌 -->
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#322659"/>
      <stop offset="1" stop-color="#17152a"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0.72" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbbcff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6dcff"/>
      <stop offset="1" stop-color="#a488e8"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7254d1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 圆角容器（与 .brand-mark / .mark 容器一致） -->
  <rect x="96" y="96" width="832" height="832" rx="176" fill="url(#box)"/>
  <rect x="96" y="96" width="832" height="832" rx="176" fill="url(#ambient)"/>
  <rect x="96" y="96" width="832" height="832" rx="176" fill="none" stroke="#7254d1" stroke-width="10"/>

  <!-- 背景光晕 -->
  <circle cx="512" cy="470" r="340" fill="url(#halo)"/>

  <!-- 耳朵 -->
  <rect x="398" y="206" width="72" height="112" rx="32" fill="#8b5cf6" transform="rotate(-16 434 262)"/>
  <rect x="554" y="206" width="72" height="112" rx="32" fill="#8b5cf6" transform="rotate(16 590 262)"/>
  <!-- 头顶发簇 -->
  <circle cx="512" cy="268" r="40" fill="#8b5cf6"/>

  <!-- 头 -->
  <rect x="392" y="270" width="240" height="340" rx="104" fill="url(#body)"/>

  <!-- 口鼻 -->
  <rect x="430" y="504" width="256" height="110" rx="55" fill="url(#muzzle)"/>

  <!-- 眼睛（青色）与鼻孔 -->
  <circle cx="556" cy="396" r="30" fill="#19c8d1" opacity="0.25"/>
  <circle cx="556" cy="396" r="18" fill="#19c8d1"/>
  <circle cx="636" cy="559" r="11" fill="#17152a" opacity="0.85"/>

  <!-- dock 底座：下托 + 主架 + 在线状态点 -->
  <rect x="382" y="770" width="260" height="32" rx="16" fill="#3f3374"/>
  <rect x="298" y="698" width="428" height="46" rx="23" fill="url(#dock)"/>
  <circle cx="686" cy="721" r="18" fill="#39d98a" opacity="0.35"/>
  <circle cx="686" cy="721" r="9" fill="#39d98a"/>
</svg>
